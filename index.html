<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azura Design Studio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- En-tête -->
  <header>
    <div class="logo">Azura Design Studio</div>
    <nav>
      <a href="#">Accueil</a>
      <a href="#">Portfolio</a>
      <a href="#">À propos</a>
      <a href="#">Contact</a>
      <a href="#" class="premium">Premium</a>
    </nav>
  </header>

  <!-- Section Héros -->
  <section class="hero">
    <div class="hero-text">
      <h1>Intérieurs Modernes & Luxueux</h1>
      <p>Nous créons des espaces élégants et intemporels pour un style de vie premium.</p>
      <a href="#" class="btn">Voir le Portfolio</a>
    </div>
  </section>

  <!-- Section Portfolio -->
  <section class="portfolio">
    <h2>Nos Projets</h2>
    <div class="cards">
      <div class="card">
        <img src="images/project1.jpg" alt="Salon">
        <p>Salon</p>
      </div>
      <div class="card">
        <img src="images/project2.jpg" alt="Salle à manger">
        <p>Salle à manger</p>
      </div>
      <div class="card">
        <img src="images/project3.jpg" alt="Cuisine">
        <p>Cuisine</p>
      </div>
    </div>
  </section>

  <!-- Pied de page -->
  <footer>
    <p>&copy; 2026 Azura Design Studio. Tous droits réservés.</p>
    <div class="socials">
      <a href="https://www.instagram.com/azura_dstudio/" target="_blank">
        <img src="images/instagram.png" alt="Instagram Azura Design Studio">
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
