<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxDesign Premium</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo"><img src="images/logo.png" alt="LuxDesign Logo"></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Portfolio</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="#" class="premium">Premium</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>Luxury Interior Design</h1>
      <p>Elegant, timeless spaces crafted for a premium lifestyle.</p>
      <a href="#" class="btn">Explore Portfolio</a>
    </div>
  </section>

  <!-- Portfolio Section -->
  <section class="portfolio">
    <h2>Our Projects</h2>
    <div class="cards">
      <div class="card">
        <img src="images/project1.jpg" alt="Modern Villa">
        <p>Modern Villa</p>
      </div>
      <div class="card">
        <img src="images/project2.jpg" alt="Luxury Apartment">
        <p>Luxury Apartment</p>
      </div>
      <div class="card">
        <img src="images/project3.jpg" alt="Office Interior">
        <p>Office Interior</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 LuxDesign. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
